[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-grpo"
version = "0.1.0"
description = "Auditable multi-turn tool GRPO experiment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.6.0", "transformers==4.51.3", "peft==0.15.2", "accelerate==1.6.0", "datasets==3.5.0", "numpy==2.2.5", "safetensors==0.5.3"]

[project.scripts]
agent-grpo = "agent_grpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
